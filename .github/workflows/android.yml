# Android-App (TWA) bauen und in die Play Console laden. Startet von Hand (Actions → «Android-App» →
# «Run workflow») oder bei jedem Push auf main, der twa-manifest.json ändert. Die App zeigt
# drink-tracker.app; ein neuer Build ist nur nötig, wenn sich Manifest, Icons oder Name ändern.
#
# Secrets (Settings → Secrets and variables → Actions):
#   PLAY_SERVICE_ACCOUNT_JSON     Dienstkonto mit Zugriff auf die App in der Play Console (JSON)
#   ANDROID_UPLOAD_KEYSTORE_B64   Upload-Schlüssel (upload-key.jks) als Base64
#   ANDROID_KEYSTORE_PASSWORD     Passwort des Keystores
#   ANDROID_KEY_PASSWORD          Passwort des Schlüssels «upload» (oft gleich wie oben)
name: Android-App

on:
  push:
    branches: [main]
    paths: ["twa-manifest.json", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Versionsname, z. B. 1.0.1"
        required: true
        default: "1.0.0"
      track:
        description: "Play-Track"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      hochladen:
        description: "In die Play Console laden (sonst nur bauen)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACK: ${{ inputs.track || 'internal' }}
      HOCHLADEN: ${{ github.event_name == 'push' || inputs.hochladen }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bubblewrap einrichten
        run: |
          npm install -g @bubblewrap/cli@1
          mkdir -p ~/.bubblewrap
          # JDK aus setup-java, Android-SDK ist auf den GitHub-Runnern vorinstalliert. Bubblewrap sucht
          # sdkmanager unter tools/bin (alte SDK-Struktur), der Runner hat ihn unter cmdline-tools/latest/bin.
          [ -e "$ANDROID_HOME/tools/bin" ] || { mkdir -p "$ANDROID_HOME/tools"; ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/tools/bin"; }
          # Build-Tools in der Version, die Bubblewrap verlangt, vorab installieren (sonst fragt es nach)
          BT=$(node -p "require('$(npm root -g)/@bubblewrap/cli/node_modules/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools').BUILD_TOOLS_VERSION" 2>/dev/null \
            || node -p "require('$(npm root -g)/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools').BUILD_TOOLS_VERSION")
          echo "Build-Tools $BT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BT" > /dev/null
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Version setzen
        # Versionscode = Laufnummer des Workflows, damit jeder Upload eine höhere Nummer hat
        run: |
          NAME="${{ inputs.versionName }}"
          [ -n "$NAME" ] || NAME="$(jq -r .appVersionName twa-manifest.json)"
          echo "VERSION=$NAME" >> "$GITHUB_ENV"
          jq --arg name "$NAME" --argjson code "${{ github.run_number }}" \
            '.appVersionName = $name | .appVersionCode = $code' twa-manifest.json > m.json
          mv m.json twa-manifest.json
          jq '{packageId, appVersionName, appVersionCode}' twa-manifest.json

      - name: Upload-Schlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_UPLOAD_KEYSTORE_B64 fehlt"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > upload-key.jks

      - name: Projekt erzeugen und bauen
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build
          ls -l *.aab *.apk

      - name: Fingerabdruck des Upload-Schlüssels anzeigen
        # Für ANDROID_SHA256 (zusätzlich zum Fingerabdruck von Play App Signing), nur für Tests mit der APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore upload-key.jks -alias upload -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: drink-tracker-${{ env.VERSION }}-${{ github.run_number }}
          path: |
            app-release-bundle.aab
            app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: In die Play Console laden
        # Erst wenn die erste Version von Hand in der Play Console liegt und das Dienstkonto Zugriff hat
        if: env.HOCHLADEN == 'true' && env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.drinktracker
          releaseFiles: app-release-bundle.aab
          track: ${{ env.TRACK }}
          # Solange die App noch nie veröffentlicht wurde, nimmt Google nur Entwürfe an
          status: draft
          releaseName: ${{ env.VERSION }} (${{ github.run_number }})

      - name: Schlüssel entfernen
        if: always()
        run: rm -f upload-key.jks
